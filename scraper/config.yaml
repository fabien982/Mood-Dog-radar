  - "Terres du Son"               # Monts (37)
  - "Yellow Festival"             # Glisy (80)
  - "Walking Bass Festival"
  - "Marsatac"                    # Marseille
  - "Delta Festival"              # Marseille
  - "Fiesta des Suds"             # Marseille
  - "Les Plages Électroniques"    # Cannes
  - "Jazz à Juan"                 # Antibes Juan-les-Pins
  - "Nice Jazz Festival"          # Nice
