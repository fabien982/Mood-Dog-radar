  - besoin d'un food truck
  - food truck bienvenu
  - food trucks bienvenus
  - places disponibles
  - réservez votre emplacement

# --- Vérification des liens -------------------------------------------
# Chaque annonce trouvée sur le web est relue depuis le VRAI lien avant d'être gardée.
# Si la page ne parle pas de food truck dans ta zone, l'annonce est écartée.
verification_liens:
  actif: true
  max: 200                 # pages vérifiées au maximum par passage
  garder_illisibles: false # pages fermées (connexion Facebook…) : on les écarte

# Combien de jours on garde une annonce sans date une fois trouvée.
conserver_jours: 90

# --- Source 1 : BOAMP (marchés publics, gratuit, sans inscription) ------
boamp:
  actif: true
  jours: 120          # on regarde les annonces publiées ces 120 derniers jours
  termes:
    - food truck
    - foodtruck
    - restauration ambulante
    - commerce ambulant
    - camion restaurant
    - vente ambulante
  # Appels d'occupation du domaine public (buvettes, kiosques, plages, festivals...)
  # gardés seulement s'ils contiennent un mot de « contexte_restauration ».
  termes_occupation:
    - occupation du domaine public
    - occupation temporaire du domaine public
    - autorisation d'occupation temporaire
    - convention d'occupation
    - buvette
    - petite restauration
    - restauration rapide
  contexte_restauration:
    - restauration
    - buvette
    - snack
    - food truck
    - foodtruck
    - petite restauration
    - restauration rapide
    - glacier
    - crêperie
    - vente à emporter
    - alimentaire

