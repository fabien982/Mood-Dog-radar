  - "https://www.google.fr/alerts/feeds/09082416725181126299/17067609991950702410"
  - "https://www.google.fr/alerts/feeds/09082416725181126299/9746109399651660703"

# --- Source 3 : Recherche web (clé API Brave ou Serper, facultatif) -----
recherche_web:
  actif: true
  une_fois_par_jour: true   # les passages automatiques ne cherchent sur le web que le matin
  # Chaque groupe a son rythme. {zone} = chaque zone de « zones_recherche », {annee} = cette année et la suivante.
  groupes:
    - nom: "Candidatures"
      type: demandes          # on veut qu'on CHERCHE un food truck
      tous_les_jours: 1
      max: 30
      modeles:
        - '"appel à candidatures" "food truck" {zone}'
        - '"recherche des food trucks" OR "recherchons des food trucks" OR "recherche food truck" {zone}'
        - '"food truck" exposants inscription fête OR festival OR marché {zone}'
        - '"appel à manifestation d''intérêt" "food truck" OR "restauration ambulante" {zone}'
        - 'mairie "food truck" emplacement OR AOT OR "domaine public" {zone}'

    - nom: "Instagram"
      type: demandes
      tous_les_jours: 3
      max: 12
      modeles:
        - 'site:instagram.com "food truck" "appel à candidatures" OR recherche OR recherchons {zone}'
        - 'site:instagram.com "food trucks" exposants OR inscriptions {zone}'

    - nom: "Mairies de ma zone"
      type: demandes
      tous_les_jours: 1
      max: 24
      modeles:
        - 'site:ville-frejus.fr "food truck" OR "avis de publicité" OR "occupation du domaine public"'
        - 'site:ville-saintraphael.fr "food truck" OR "appel à candidatures" OR "occupation du domaine public"'
        - 'site:mairie-grimaud.fr OR site:grimaud-provence.com "food truck" OR "appel à candidatures" OR exposants'
        - 'site:ville-sainttropez.fr "food truck" OR "appel à candidatures" OR "occupation du domaine public"'
        - 'site:cannes.com OR site:vosdemarches.cannes.com "food truck" OR "avis de publicité" OR "restauration ambulante"'
        - 'site:nice.fr OR site:nicecotedazur.org "food truck" OR "appel à manifestation" OR "restauration ambulante"'
        - 'mairie "food truck" "appel à candidatures" Sainte-Maxime OR Roquebrune-sur-Argens OR Puget-sur-Argens OR "Le Muy" OR Draguignan'
        - 'mairie "food truck" "appel à candidatures" Mandelieu OR Antibes OR Grasse OR Cagnes-sur-Mer OR Hyères OR Cogolin'

    - nom: "Festivals, domaines et châteaux"
      type: demandes
      tous_les_jours: 3
      max: 24
      modeles:
        - 'festival musique "food truck" exposants OR candidature OR "recherche" {zone} {annee}'
        - 'domaine viticole OR château "food truck" recherche OR candidature OR exposants {zone}'
        - 'domaine OR château "afterwork" OR "soirée" "food truck" {zone} {annee}'
        - 'festival "restauration" "appel à candidatures" OR "dossier exposant" {zone} {annee}'

    - nom: "Festivals suivis"
      type: demandes
      liste: festivals_suivis   # voir la liste plus bas
      hors_zone: true           # tu as choisi ces festivals : on les garde même loin
      tous_les_jours: 3
      max: 60
      modeles:
        - '"{nom}" "food truck" OR foodtruck OR restauration OR exposants candidature OR "appel à candidatures" {annee}'

    - nom: "Fêtes et festivals"
      type: evenements        # toutes les fêtes à venir, pour démarcher toi-même les organisateurs
      tous_les_jours: 7       # une fois par semaine suffit
      max: 42
      modeles:
        - '"fête du village" OR "fête votive" OR "fête patronale" OR "fête locale" {zone} {annee}'
        - 'festival {zone} {annee} programme dates'
        - '"marché nocturne" OR "marchés nocturnes" OR "marché de noël" {zone} {annee}'
        - '"vide-grenier" OR brocante OR foire {zone} {annee}'
        - 'feria OR carnaval OR corso OR "fête de la musique" {zone} {annee}'
        - 'concert OR guinguette "plein air" {zone} {annee}'
        - 'site:instagram.com fête OR festival OR "marché nocturne" {zone} {annee}'

# --- Tous les festivals de PACA ----------------------------------------
# Chaque semaine, le robot relit l'annuaire festivalenfrance.com (≈ 360 festivals en PACA).
# Chaque matin, il cherche l'appel à candidatures restauration / food truck de quelques
# festivals, à tour de rôle (ceux qui ont lieu le plus tôt passent en premier).
festivals_paca:
  actif: true
  annuaire: "https://www.festivalenfrance.com/festivals/provence-alpes-cote-dazur"
  annuaire_tous_les_jours: 7
  pages_max: 30
  par_jour: 12   # festivals vérifiés par matin (≈ 360 festivals vérifiés par mois)

# --- Festivals que tu veux suivre --------------------------------------
# Le robot cherche leur appel à candidatures restauration / food truck tous les 3 jours.
