<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mood Dog Radar</title>
  <meta name="description" content="Opportunités food truck : appels à candidatures, marchés publics et événements.">
  <meta name="theme-color" content="#F7F1E9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Radar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <section class="hero">
      <div class="hero-top">
        <p class="today" id="today">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span></span>
        </p>
        <button class="icon-btn" id="btn-info" aria-label="Infos sur la recherche">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <h1>Bienvenue, Fabien</h1>
      <p class="lead">Voici vos opportunités et relances du moment</p>
      <p id="subtitle">Chargement…</p>
    </section>

    <section class="stats" aria-label="Résumé">
      <button class="stat" data-go="nouv"><span>Nouvelles demandes de food truck</span><b id="n-nouv">–</b></button>
      <button class="stat" data-go="relancer"><span>À relancer</span><b id="n-relancer">–</b></button>
      <button class="stat" data-go="envoye"><span>Candidatures en attente</span><b id="n-envoye">–</b></button>
    </section>

    <h2 class="section-title">À traiter</h2>
    <p class="section-sub">Files de travail</p>
    <nav class="chips" id="chips" aria-label="Files de travail">
      <button data-f="demandes" class="on">Demandes de food truck</button>
      <button data-f="verif">✓ Vérifiées</button>
      <button data-f="nouv">☆ Nouvelles</button>
      <button data-f="revoir">☐ À revoir</button>
      <button data-f="envoye">✉ Candidatures</button>
      <button data-f="relancer">↻ À relancer</button>
      <button data-f="event">Fêtes à démarcher</button>
      <button data-f="tout">Tout voir</button>
      <button data-f="marche">Marchés publics</button>
      <button data-f="fav">Favoris</button>
      <button data-f="masque">Masqués</button>
    </nav>

    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Rechercher une opportunité…" autocomplete="off" aria-label="Rechercher">
    </label>

    <div class="tools">
      <select id="dept" aria-label="Département"><option value="">Tous les départements</option></select>
      <select id="sort" aria-label="Trier">
        <option value="echeance">Clôture la plus proche</option>
        <option value="score">Plus pertinents</option>
        <option value="recent">Plus récents</option>
        <option value="distance">Plus proches de moi</option>
      </select>
    </div>

    <div class="switch" role="tablist" aria-label="Affichage">
      <button role="tab" aria-selected="true" data-view="liste">Liste</button>
      <button role="tab" aria-selected="false" data-view="carte">Carte</button>
    </div>
  </header>

  <main>
    <section id="liste" class="list" aria-live="polite"></section>
    <section id="carte" class="map-wrap" hidden><div id="map"></div></section>
  </main>

  <dialog id="sheet" class="sheet"><div class="sheet-body" id="sheet-body"></div></dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
